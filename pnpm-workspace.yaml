minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  image-size@2: 2.0.3
  sharp@0.35: 0.35.5
  miniflare>sharp: 0.35.5
  undici@7: 7.29.1
  ws@8: 8.21.0
  esbuild@<0.24.3: 0.25.12
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  js-yaml@4: 4.3.2
  brace-expansion@1: 1.1.20
  brace-expansion@5: 5.0.11
  source-map-js@1: 1.2.2
  '@babel/core@7': ^7.29.1
  browserslist@4: 4.28.7
  baseline-browser-mapping@2: 2.11.0
  fflate@0.7: 0.7.5
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
auditConfig:
  # Fixed by the checksum-pinned local patch above; dependency-guards.mjs must
  # pass through both affected dependency paths before CI runs the audit.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
